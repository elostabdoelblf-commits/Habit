{"name":"Build APK","on":{"workflow_dispatch":{},"push":{"branches":["main","master"]}},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"run":"sudo apt-get update && sudo apt-get install -y imagemagick"},{"run":"mkdir -p www assets && cp index.html www/index.html"},{"run":"convert icon-512.png -resize 1024x1024! assets/icon-only.png && convert icon-512.png -resize 655x655 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png && convert -size 1024x1024 xc:'#030610' assets/icon-background.png"},{"run":"jq '.appName=\"HABIT MENTALITY\" | .appId=\"com.habitmentality.app\"' capacitor.config.json > cc.json && mv cc.json capacitor.config.json"},{"run":"npm install"},{"run":"npx cap add android"},{"run":"sed -i 's|<string name=\"title_activity_main\">[^<]*</string>|<string name=\"title_activity_main\">H.M</string>|' android/app/src/main/res/values/strings.xml"},{"run":"npx capacitor-assets generate --android --assetPath assets"},{"run":"npx cap sync android"},{"run":"cd android && chmod +x gradlew && ./gradlew assembleDebug"},{"uses":"actions/upload-artifact@v4","with":{"name":"HABIT-MENTALITY-apk","path":"android/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
